# evebloggers.com. Shared settings live in evebloggers-site.inc.
#
# Cloudflare proxies the site. In Cloudflare's "Flexible" SSL mode it reaches this server over
# plain HTTP even for HTTPS visitors, so the HTTP->HTTPS redirect keys off X-Forwarded-Proto
# (the visitor's scheme) rather than the connection, which would otherwise loop.

<VirtualHost *:80>
    ServerName evebloggers.com
    ServerAlias eb.fuzzwork.co.uk
    Include /etc/apache2/sites-available/evebloggers-site.inc

    <If "%{HTTP:X-Forwarded-Proto} != 'https' && %{REQUEST_URI} !~ m#^/\.well-known/acme-challenge/#">
        Redirect permanent "https://evebloggers.com%{REQUEST_URI}"
        # Cloudflare caches some URLs (e.g. feed.php) without the scheme in the cache key;
        # a cached redirect would then be served to HTTPS visitors too and loop.
        Header always set Cache-Control "no-store"
    </If>
</VirtualHost>

<VirtualHost *:80>
    ServerName www.evebloggers.com
    ServerAlias blogpack.evebloggers.com
    Redirect permanent / https://evebloggers.com/
    Header always set Cache-Control "no-store"
</VirtualHost>

# Origin certificate (Let's Encrypt via acme.sh). These vhosts switch on once the files exist;
# then set Cloudflare SSL/TLS mode to "Full (strict)".
<IfFile "/home/web/conf/ssl/acmesh/evebloggers.com.key">
<IfFile "/home/web/conf/ssl/acmesh/evebloggers.com.fullchain.cer">
<VirtualHost *:443>
    ServerName evebloggers.com
    Include /etc/apache2/sites-available/evebloggers-site.inc
    SSLEngine on
    SSLCertificateFile    /home/web/conf/ssl/acmesh/evebloggers.com.fullchain.cer
    SSLCertificateKeyFile /home/web/conf/ssl/acmesh/evebloggers.com.key
</VirtualHost>

<VirtualHost *:443>
    ServerName www.evebloggers.com
    SSLEngine on
    SSLCertificateFile    /home/web/conf/ssl/acmesh/evebloggers.com.fullchain.cer
    SSLCertificateKeyFile /home/web/conf/ssl/acmesh/evebloggers.com.key
    Redirect permanent / https://evebloggers.com/
</VirtualHost>
</IfFile>
</IfFile>
